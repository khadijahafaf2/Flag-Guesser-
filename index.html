<!DOCTYPE html>
<html>
    <head>
        <title>Guess the Flag</title>
        <link rel="stylesheet" href="style.css">   
        <img src = "sticker1.png" class="sticker top-left"> 
        <img src = "sticker2.png" class="sticker top-right">
        <img src = "sticker3.png" class="sticker bottom-left">
        <img src = "sticker4.png" class="sticker bottom-right">
        
    </head>

    <body>
        <div id="home">
            <h1>🌍 Guess The Flag </h1>
           <audio id="bgMusic" loop>
            <source src="music.weba" type="audio/mpeg">
           </audio>
            <img src="flages.jpeg" alt="home image">
            <br><br>
            <button id="start-btn" onclick="startGame()">
                Start Game
            </button>
        </div>

        <div class="game" style="display:none;">
            <h1> 🌍 Can You Guess the Flag? </h1>

            <p id = "score"> Score: 0 </p>

            <img id = "flag" src="flags/usa.png" alt="Flag Image">
            
            <div id = "buttons">
                <button class="option" onclick=" checkAnswer(0)"> Option 1 </button>
                <button class="option" onclick=" checkAnswer(1)"> Option 2 </button>
                <button class="option" onclick=" checkAnswer(2)"> Option 3 </button>
                <button class="option" onclick=" checkAnswer(3)"> Option 4 </button>    

            </div>
            <p id = "result"> </p>

            <div id ="volume-control">
                 🔊 Volume
                 <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
            </div>
        </div>
         
        <script>

  const questions = [
{
    Flag: "japan.jpg",
    answer: "Japan",
    Options: ["Japan", "China", "South Korea", "Vietnam"]
},
{
    Flag: "Ukraine.jpeg",
    answer: "Ukraine",
    Options: ["Sweden", "Ukraine", "Belarus", "Poland"]
},
{
    Flag: "Germany.jpg",
    answer: "Germany",
    Options: ["Poland", "Netherlands", "Germany", "Austria"]
},
{
    Flag: "France.png",
    answer: "France",
    Options: ["Colombia", "Bellarus", "Austria", "France",]
},
{
    Flag: "Brazil.jpg",
    answer: "Brazil",
    Options: ["Thailand", "Norway", "Sweden", "Brazil",]
},
{
    Flag: "italy.jpg",
    answer:"Italy",
    Options: ["Finland","New Zealand", "Italy","Poland",]

},
{
    Flag: "colombia.jpg",
    answer: "Colombia",
    Options: ["Bolivia","Colombia","Peru","South Africa",]
},
{
    Flag: "canada.jpg",
    answer: "Canada",
    Options: ["Canada","Algeria","Kenya","USA",]

},
{
    Flag: "india.jpeg",
    answer:"India",
    Options: ["Sri Lanka","Egypt","India","France",]
},
{ 
    Flag: "mongolia.jpeg",
    answer: "Mongolia",
    Options: ["Mongolia","Turkmenistan","Tajkistan","Kyrgystan",] 
},
{
    Flag: "morocco.jpeg",
    answer: "Morocco",
    Options: ["Turkey","Morocco","Madagascar","China",]
},
];

   let current = 0;
   let score = 0;

  window.onload = function() {

   let music = document.getElementById("bgMusic");

   document.getElementById("volumeSlider").addEventListener("input", function() {

      music.volume = this.value;

   });

};

function startGame() {
    document.getElementById("home").style.display = "none";
    document.querySelector(".game").style.display = "block";
    
    let music = document.getElementById("bgMusic");
    music.play();

    loadQuestion(); // start game HERE
}

function loadQuestion() {
    document.getElementById("flag").src = questions[current].Flag;

    let buttons = document.getElementsByClassName("option");

    for (let i = 0; i < 4; i++) {
        buttons[i].innerHTML = questions[current].Options[i];
    } 
}

function checkAnswer(index) {

    let buttons = document.getElementsByClassName("option");

    if (buttons[index].innerHTML === questions[current].answer) {
        score++;
        document.getElementById("score").innerHTML = "Score: " + score;
        document.getElementById("result").innerHTML = "✅ Correct!";
    } else {
        document.getElementById("result").innerHTML =
        "❌ Wrong! It was " + questions[current].answer;
    }

    current++;

    setTimeout(() => {

        document.getElementById("result").innerHTML = "";

        if (current < questions.length) {
            loadQuestion();
        } else {
            document.querySelector(".game").innerHTML =
            "<h1>🎉 Game Over 🎉</h1>" +
            "<h2>Your Final Score: " + score + "/" + questions.length + "</h2>";
        }

    }, 1000);
}    
</script>
 </body>
</html>
