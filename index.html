<!DOCTYPE html>
<html>
    <head>
        <title>Guess the Flag</title>
        <link rel="stylesheet" href="style.css">   
    </head>

    <body>
        <div id="home">
            <h1>🌍 Guess The Flag </h1>
            <img src="flages.jpeg" alt="home image">
            <br><br>
            <button id="start-btn" onclick="startGame()">
                Start Game
            </button>
        </div>

        <div class="game" style="display:none;">
            <h1> 🌍 Can You Guess the Flag? </h1>

            <p id = "score"> Score: 0 </p>

            <img id = "flag" src="flags/usa.png" alt="Flag Image">
            
            <div id = "buttons">
                <button class="option" onclick=" checkAnswer(0)"> Option 1 </button>
                <button class="option" onclick=" checkAnswer(1)"> Option 2 </button>
                <button class="option" onclick=" checkAnswer(2)"> Option 3 </button>
                <button class="option" onclick=" checkAnswer(3)"> Option 4 </button>    

            </div>
            <p id = "result"> </p>
        </div>
         
        <script>
            const questions = [
          {
               Flag: "japan.jpg",
               answer: "Japan",
               Options: ["Japan", "China", "South Korea", "Vietnam"]
            },
            
            { 
                Flag: "Ukraine.jpeg",
                answer: "Ukraine",
                Options: ["Sweden", "Ukraine", "Belarus", "Poland"]
            },
          
            {
                Flag: "Germany.jpg",
                answer: "Germany",
                Options: ["Poland", "Netherlands", "Germany", "Austria"]
            },

            {
                Flag: "brazil.jpg",
                answer: "Brazil",
                Options: ["Argentina", "Brazil", "Colombia", "Peru"]
            },

            {
                Flag: "italy.jpg",
                answer: "Italy",
                Options: ["Italy", "Brazil", "Madagascar", "Portugal"]
            },

            {
                Flag: "india.jpeg",
                answer: "India",
                Options: ["Sri Lanka", "Saudi Arabia", "Iraq", "India"]
            },

            {
                Flag: "canada.jpg",
                answer: "Canada",
                Options: ["Mexico", "India", "Turkey", "Canada"]
            },

            {
                Flag: "France.png",
                answer: "France",
                Options: ["Italy", "Netherlands", "France", "Russia"]
            },

            {
                Flag: "colombia.jpg",
                answer: "Colombia",
                Options: ["China", "Colombia", "Peru", "Venezuela"]
            },

            {
                Flag: "southafrica.jpg",
                answer: "South Africa",
                Options: ["South Africa", "Kenya", "Nigeria", "Egypt"]
            }
            ];

            let current = 0;
            let score = 0;

            function startGame() {
                document.getElementById("home").style.display = "none";
                document.querySelector(".game").style.display = "block";
            }

            function loadQuestion() {;                   
               document.getElementById("flag").src = questions[current].Flag;
                
               let buttons = document.getElementsByClassName("option");
              
               for(let i = 0; i < 4; i++) {
                     buttons[i].innerHTML = questions[current].Options[i];
               }
            
            }
            function checkAnswer(index) {

    let buttons = document.getElementsByClassName("option");

    if (buttons[index].innerHTML === questions[current].answer) {
        score++;
        document.getElementById("score").innerHTML = "Score: " + score;
        document.getElementById("result").innerHTML = "✅ Correct!";
    } else {
        document.getElementById("result").innerHTML =
        "❌ Wrong! It was " + questions[current].answer;
    }

    current++;

    setTimeout(() => {

        document.getElementById("result").innerHTML = "";

        if (current < questions.length) {
            loadQuestion();
        } else {
            document.querySelector(".game").innerHTML =
            "<h1>🎉 Game Over 🎉</h1>" +
            "<h2>Your final score is: " + score + "/" + questions.length + "</h2>";
        }

    }, 1000);
       }
                }
                if(current < questions.length){
                    setTimeout(() => {
                        document.getElementById("result").innerHTML = "";
                        loadQuestion();
                    }, 1000);
                } else {
                    setTimeout(() => {
                        document.querySelector(".game").innerHTML = 
                        "<h1> 🎉 Game Over 🎉</h1>" +
                        "<h2> Your final score is: " + score + "/" + questions.length + "</h2>";
                    }, 1000);

                    }
            });
                loadQuestion();

        </script>
    </body>
</html>
